services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Host port defaults to 5432 (PRD §5). Override with POSTGRES_PORT only if
      # 5432 is taken on your machine (then point DATABASE_URL at the same port).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docintel"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
